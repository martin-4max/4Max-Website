  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ite-space:nowrap\" style-hover=\"background:#4527d1\">Contact<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fnav>\n\n  <section data-reveal=\"1\" style=\"padding:26px 0 28px;text-align:center\">\n    <div style=\"max-width:1160px;margin:0 auto;padding:0 24px\">\n      <div style=\"color:#5b37ff;font-weight:700;font-size:14px;letter-spacing:.04em;text-transform:uppercase;margin-bottom:12px\">LinkedIn Recommendations<\u002Fdiv>\n      <h1 style=\"color:#1d243c;font-size:clamp(28px,5.2vw,42px);font-weight:700;margin:0 0 18px;line-height:1.2\">What Colleagues &amp; Clients Say<\u002Fh1>\n      <p style=\"max-width:680px;margin:0 auto;font-size:16px;text-wrap:pretty\">Recommendations from peers, managers, and partners I've worked alongside across two decades in Maximo enablement, certification, and training — as shared on <a href=\"https://www.linkedin.com/in/martin-williams-maximo\" target=\"_blank\" rel=\"noopener\" style=\"color:#5b37ff;text-decoration:none\">LinkedIn<\u002Fa>.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-reveal=\"1\" style=\"position:relative;z-index:1;padding:0 0 24px\">\n    <div style=\"max-width:960px;margin:0 auto;padding:0 24px;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px\">\n      <div style=\"background:#fff;border:1px solid #dcd8ea;border-radius:10px;box-shadow:0 4px 14px rgba(29,36,60,0.09);padding:22px 24px;text-align:center\">\n        <div data-count=\"2586\" data-suffix=\"\" style=\"color:#5b37ff;font-size:clamp(28px,4.4vw,38px);font-weight:800;line-height:1.1\">2,586<\u002Fdiv>\n        <div style=\"font-size:13.5px;color:#8890ab;margin-top:6px\">LinkedIn followers<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#fff;border:1px solid #dcd8ea;border-radius:10px;box-shadow:0 4px 14px rgba(29,36,60,0.09);padding:22px 24px;text-align:center\">\n        <div data-count=\"75230\" data-suffix=\"\" style=\"color:#5b37ff;font-size:clamp(28px,4.4vw,38px);font-weight:800;line-height:1.1\">75,230<\u002Fdiv>\n        <div style=\"font-size:13.5px;color:#8890ab;margin-top:6px\">LinkedIn impressions, last 365 days<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <div style=\"position:relative;z-index:1;max-width:960px;margin:0 auto;padding:0 24px\">\n    <div ref=\"{{ listRef }}\" style=\"padding:12px 0 40px;display:flex;flex-direction:column;gap:24px\">\n\n      <div data-reveal=\"1\" style=\"position:relative;overflow:hidden;background:#fff;border:1px solid #dcd8ea;border-radius:10px;padding:clamp(20px,4vw,28px) clamp(18px,4vw,32px);box-shadow:0 4px 14px rgba(29,36,60,0.09)\">\n        <div aria-hidden=\"true\" style=\"position:absolute;top:-14px;right:146px;font-size:120px;line-height:1;font-weight:800;color:#ddd6fb;pointer-events:none;user-select:none\">”<\u002Fdiv>\n        \n        <div style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 14px; margin-bottom: 18px; position: relative\">\n          <img src=\"61918a09-05a2-40c6-b814-83b74aeeb8ed\" alt=\"Andrew Jeffery\" style=\"width:56px;height:56px;border-radius:50%;object-fit:cover;flex-shrink:0;border:1px solid #ececf2\">\n          <div>\n            <div style=\"color:#1d243c;font-weight:700;font-size:16px;margin:0 0 2px\">Andrew Jeffery<\u002Fdiv>\n            <div style=\"font-size:13px;color:#3f4c7c;margin:0 0 4px\">Maximo SME at Naviam (formerly ZNAPZ) | IBM Champion 2026 | Maximo Secrets Author<\u002Fdiv>\n            <div style=\"font-size:12.5px;color:#8890ab\">April 3, 2026 &nbsp;·&nbsp; Worked with Martin but on different teams<\u002Fdiv>\n          <\u002Fdiv>\n        <img src=\"3b6a1293-dbb7-4b26-817c-ad53408614b5\" alt=\"IBM Champion\" title=\"IBM Champion\" style=\"position: absolute; top: -3px; width: 112px; height: 80px; object-fit: contain; border-radius: 6px; z-index: 2; left: 718px\"><\u002Fdiv>\n        <p data-rec-text=\"1\" style=\"font-size:15px;color:#3f4c7c;margin:0;text-wrap:pretty\">Martin is one of the most knowledgeable Maximo Application Suite (MAS) experts on the planet. He has steered many expert teams through the creation of Maximo and MAS professional certifications and for 20 years has been developing Maximo and MAS training courses for IBM, and teaching the Maximo boot camp. If you are looking for someone to help you develop bespoke training content, you needn't look any further, he is highly recommended. (Andrew Jeffery, the author of Maximo Secrets).<\u002Fp>\n        <button type=\"button\" data-rec-toggle=\"1\" style=\"display:none;margin-top:12px;background:none;border:0;padding:0;font-family:inherit;font-size:14px;font-weight:700;color:#5b37ff;cursor:pointer\">Read more<\u002Fbutton>\n      <\u002Fdiv>\n\n      <div data-reveal=\"1\" style=\"position:relative;overflow:hidden;background:#fff;border:1px solid #dcd8ea;border-radius:10px;padding:clamp(20px,4vw,28px) clamp(18px,4vw,32px);box-shadow:0 4px 14px rgba(29,36,60,0.09)\">\n        <div aria-hidden=\"true\" style=\"position:absolute;top:-14px;right:20px;font-size:120px;line-height:1;font-weight:800;color:#ddd6fb;pointer-events:none;user-select:none\">”<\u002Fdiv>\n        <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:14px;margin-bottom:18px\">\n          <img src=\"0796ccf0-29bb-4454-b9fc-a3a6395ade40\" alt=\"Morgan Brown\" style=\"width:56px;height:56px;border-radius:50%;object-fit:cover;flex-shrink:0;border:1px solid #ececf2\">\n          <div>\n            <div style=\"color:#1d243c;font-weight:700;font-size:16px;margin:0 0 2px\">Morgan Brown<\u002Fdiv>\n            <div style=\"font-size:13px;color:#3f4c7c;margin:0 0 4px\">Building partner ecosystems that deliver | 20+ years IBM | Partner revenue growth expert<\u002Fdiv>\n            <div style=\"font-size:12.5px;color:#8890ab\">May 20, 2026 &nbsp;·&nbsp; Worked with Martin on the same team<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <p data-rec-text=\"1\" style=\"font-size:15px;color:#3f4c7c;margin:0;text-wrap:pretty\">There are experts, and then there are people who have genuinely shaped a field — Martin is firmly in the second category. I've had the privilege of working alongside Martin as a peer, and what strikes me most is the depth and dedication he brings to the world of Maximo. Over decades, he has built and delivered Maximo bootcamps and played a central role in writing certification programmes — not as a side project, but as a genuine vocation. He is, without exaggeration, one of the world's leading Maximo educators. What makes Martin special isn't just the breadth of his technical knowledge — it's how he shares it. He has an extraordinary ability to take complex, specialist material and make it accessible, practical, and genuinely useful for learners at every level. Countless professionals working with Maximo today have Martin's teaching to thank for their confidence and competence. If you're looking for someone who combines rare technical mastery with a real gift for education and knowledge-sharing, Martin is exceptional. I'm proud to recommend him.<\u002Fp>\n        <button type=\"button\" data-rec-toggle=\"1\" style=\"display:none;margin-top:12px;background:none;border:0;padding:0;font-family:inherit;font-size:14px;font-weight:700;color:#5b37ff;cursor:pointer\">Read more<\u002Fbutton>\n      <\u002Fdiv><div data-reveal=\"1\" style=\"position:relative;overflow:hidden;background:#fff;border:1px solid #dcd8ea;border-radius:10px;padding:clamp(20px,4vw,28px) clamp(18px,4vw,32px);box-shadow:0 4px 14px rgba(29,36,60,0.09)\">\n        <div aria-hidden=\"true\" style=\"position:absolute;top:-14px;right:20px;font-size:120px;line-height:1;font-weight:800;color:#ddd6fb;pointer-events:none;user-select:none\">”<\u002Fdiv>\n        <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:14px;margin-bottom:18px\">\n          <img src=\"05f240e0-19c9-4e17-96f8-130d85fc0d88\" alt=\"Pawel Wozniak\" style=\"width:56px;height:56px;border-radius:50%;object-fit:cover;flex-shrink:0;border:1px solid #ececf2\">\n          <div>\n            <div style=\"color:#1d243c;font-weight:700;font-size:16px;margin:0 0 2px\">Pawel Wozniak<\u002Fdiv>\n            <div style=\"font-size:13px;color:#3f4c7c;margin:0 0 4px\">Senior Delivery Consultant<\u002Fdiv>\n            <div style=\"font-size:12.5px;color:#8890ab\">April 28, 2026 &nbsp;·&nbsp; Worked with Martin on the same team<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <p data-rec-text=\"1\" style=\"font-size:15px;color:#3f4c7c;margin:0;text-wrap:pretty\">A rare blend of technical mastery, pedagogical precision, and modern curriculum design. I have had the privilege of knowing and working with Martin Williams for 20 years. Our journey began when I was a student on one of his Maximo trainings. Later, we became colleagues in the Advanced Technology Group, where we co-developed “Practiculums”—high-level, hands-on training sessions for the most complex Maximo-related products. Martin is, quite simply, the best trainer I have ever encountered. As an instructor, he possesses a rare precision; he has a masterful ability to manage the pace of a room, ensuring that no student is left behind while keeping the most advanced learners engaged. In recent years, Martin has successfully translated this classroom magic into the digital sphere. His development of curricula for Maximo and the Maximo Application Suite (MAS) has been transformative. He has a unique gift for taking intricate, enterprise-level technical concepts and structuring them into online training programs that are both accessible and highly effective. Furthermore, Martin has consistently been a “key player” in the creation of global certification exams. He understands the thin line between a fair question and a rigorous one, ensuring that a certification truly reflects a professional's capability. Any organization looking for a subject matter expert who can not only master Maximo but also teach it at scale—whether in a classroom or via a global digital curriculum—will find Martin to be an irreplaceable asset. I recommend him without reservation.<\u002Fp>\n        <button type=\"button\" data-rec-toggle=\"1\" style=\"display:none;margin-top:12px;background:none;border:0;padding:0;font-family:inherit;font-size:14px;font-weight:700;color:#5b37ff;cursor:pointer\">Read more<\u002Fbutton>\n      <\u002Fdiv>\n\n      \n\n      <div data-reveal=\"1\" style=\"position:relative;overflow:hidden;background:#fff;border:1px solid #dcd8ea;border-radius:10px;padding:clamp(20px,4vw,28px) clamp(18px,4vw,32px);box-shadow:0 4px 14px rgba(29,36,60,0.09)\">\n        <div aria-hidden=\"true\" style=\"position:absolute;top:-14px;right:20px;font-size:120px;line-height:1;font-weight:800;color:#ddd6fb;pointer-events:none;user-select:none\">”<\u002Fdiv>\n        <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:14px;margin-bottom:18px\">\n          <img src=\"901714f7-18c7-408e-89e7-27b73000a490\" alt=\"Aparna Srivastava\" style=\"width:56px;height:56px;border-radius:50%;object-fit:cover;flex-shrink:0;border:1px solid #ececf2\">\n          <div>\n            <div style=\"color:#1d243c;font-weight:700;font-size:16px;margin:0 0 2px\">Aparna Srivastava<\u002Fdiv>\n            <div style=\"font-size:13px;color:#3f4c7c;margin:0 0 4px\">Learning and Development Leader | Executive Development Program (HRM) XLRI (2021-22) | Certified Life Coach<\u002Fdiv>\n            <div style=\"font-size:12.5px;color:#8890ab\">April 8, 2026 &nbsp;·&nbsp; Managed Martin directly<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <p data-rec-text=\"1\" style=\"font-size:15px;color:#3f4c7c;margin:0;text-wrap:pretty\">I have had the pleasure of working closely with Martin as his manager, and I can confidently say he is one of the most impactful learning professionals I have worked with. He brings deep technical expertise in Maximo, combined with a strong ability to translate complex concepts into practical, high-quality learning experiences. Martin plays a critical role in shaping and strengthening our learning ecosystem. He brings a strong business perspective to planning and content decisions, ensuring both relevance and feasibility. He consistently identifies gaps in existing content and drives improvements based on learner feedback. He is not only a go-to expert for resolving technical challenges for trainings - elearning and classroom, but also a trusted learning consultant who designs role-based learning paths aligned to client business needs. He has been instrumental in the design and development of Maximo Application Suite certifications, contributing across all stages from concept to execution. Martin also actively supports team members through thoughtful design reviews and mentoring, continuously elevating the overall capability of the team through his guidance on both Maximo and content development. Beyond this, Martin is an excellent facilitator who has led impactful workshops and training sessions, consistently demonstrating his ability to engage audiences and build real capability. He is collaborative, dependable, and brings a strong sense of ownership to every initiative he is part of. I strongly recommend Martin to any organization looking for a technically strong, thoughtful, and highly reliable learning professional.<\u002Fp>\n        <button type=\"button\" data-rec-toggle=\"1\" style=\"display:none;margin-top:12px;background:none;border:0;padding:0;font-family:inherit;font-size:14px;font-weight:700;color:#5b37ff;cursor:pointer\">Read more<\u002Fbutton>\n      <\u002Fdiv>\n\n      <div data-reveal=\"1\" style=\"position:relative;overflow:hidden;background:#fff;border:1px solid #dcd8ea;border-radius:10px;padding:clamp(20px,4vw,28px) clamp(18px,4vw,32px);box-shadow:0 4px 14px rgba(29,36,60,0.09)\">\n        <div aria-hidden=\"true\" style=\"position:absolute;top:-14px;right:20px;font-size:120px;line-height:1;font-weight:800;color:#ddd6fb;pointer-events:none;user-select:none\">”<\u002Fdiv>\n        <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:14px;margin-bottom:18px\">\n          <img src=\"302abfd6-0352-4c82-873c-e8840a514f59\" alt=\"Tristan O'Gorman\" style=\"width:56px;height:56px;border-radius:50%;object-fit:cover;flex-shrink:0;border:1px solid #ececf2\">\n          <div>\n            <div style=\"color:#1d243c;font-weight:700;font-size:16px;margin:0 0 2px\">Tristan O'Gorman<\u002Fdiv>\n            <div style=\"font-size:13px;color:#3f4c7c;margin:0 0 4px\">Program Director | Product Leader for IBM Asset Lifecycle Management<\u002Fdiv>\n            <div style=\"font-size:12.5px;color:#8890ab\">April 7, 2026 &nbsp;·&nbsp; Worked with Martin on the same team<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <p data-rec-text=\"1\" style=\"font-size:15px;color:#3f4c7c;margin:0;text-wrap:pretty\">I worked with Martin on Maximo training and enablement across clients, partners, and internal teams. He's one of the best I've seen at making complex product knowledge stick. His sessions were well-structured, clearly delivered, and consistently got strong feedback from every audience he worked with. Anyone hiring for Maximo expertise or training and enablement roles would be lucky to have him. Recommended without hesitation.<\u002Fp>\n        <button type=\"button\" data-rec-toggle=\"1\" style=\"display:none;margin-top:12px;background:none;border:0;padding:0;font-family:inherit;font-size:14px;font-weight:700;color:#5b37ff;cursor:pointer\">Read more<\u002Fbutton>\n      <\u002Fdiv>\n\n      <div data-reveal=\"1\" style=\"position:relative;overflow:hidden;background:#fff;border:1px solid #dcd8ea;border-radius:10px;padding:clamp(20px,4vw,28px) clamp(18px,4vw,32px);box-shadow:0 4px 14px rgba(29,36,60,0.09)\">\n        <div aria-hidden=\"true\" style=\"position:absolute;top:-14px;right:20px;font-size:120px;line-height:1;font-weight:800;color:#ddd6fb;pointer-events:none;user-select:none\">”<\u002Fdiv>\n        <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:14px;margin-bottom:18px\">\n          <img src=\"e712f099-03ca-4e06-97bf-86e79244d558\" alt=\"Wendy Harnar\" style=\"width:56px;height:56px;border-radius:50%;object-fit:cover;flex-shrink:0;border:1px solid #ececf2\">\n          <div>\n            <div style=\"color:#1d243c;font-weight:700;font-size:16px;margin:0 0 2px\">Wendy Harnar<\u002Fdiv>\n            <div style=\"font-size:13px;color:#3f4c7c;margin:0 0 4px\">Communications &amp; Portfolio GTM Program Manager<\u002Fdiv>\n            <div style=\"font-size:12.5px;color:#8890ab\">April 7, 2026 &nbsp;·&nbsp; Worked with Martin on the same team<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <p data-rec-text=\"1\" style=\"font-size:15px;color:#3f4c7c;margin:0;text-wrap:pretty\">I had the pleasure of working with Martin for over three years across multiple training projects, where I served as project lead and partnered closely with him as a peer. Martin is a true Maximo expert with deep experience designing and delivering training that meets learners where they are. His expertise is widely recognized through his active LinkedIn presence and dedicated following, and he is well regarded within the broader Maximo community for sharing practical insights and thought leadership. He has a strong ability to see the whole picture and translate complex system functionality into clear, effective, audience‑focused learning experiences. Martin has built high‑quality training for both instructor‑led and self‑paced formats, including engaging video-based content using animated slides with narration, captions, and transcripts. His work consistently reflects thoughtful instructional design, strong attention to accessibility, and a commitment to learner success. Training leaders and hiring managers can trust Martin to deliver scalable learning solutions that drive real understanding and adoption. Beyond his technical and instructional strengths, Martin is dedicated, collaborative, and genuinely kind. He is a generous mentor and coach who takes pride in helping others grow—whether that's learning Maximo, building instructional skills, or developing others as trainers. I highly recommend hiring Martin for his Maximo expertise, leadership, and the positive impact he brings to any team.<\u002Fp>\n        <button type=\"button\" data-rec-toggle=\"1\" style=\"display:none;margin-top:12px;background:none;border:0;padding:0;font-family:inherit;font-size:14px;font-weight:700;color:#5b37ff;cursor:pointer\">Read more<\u002Fbutton>\n      <\u002Fdiv>\n\n      <div data-reveal=\"1\" style=\"position:relative;overflow:hidden;background:#fff;border:1px solid #dcd8ea;border-radius:10px;padding:clamp(20px,4vw,28px) clamp(18px,4vw,32px);box-shadow:0 4px 14px rgba(29,36,60,0.09)\">\n        <div aria-hidden=\"true\" style=\"position:absolute;top:-14px;right:20px;font-size:120px;line-height:1;font-weight:800;color:#ddd6fb;pointer-events:none;user-select:none\">”<\u002Fdiv>\n        <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:14px;margin-bottom:18px\">\n          <img src=\"8da943f1-ff1a-4b37-b598-adfba8007a2c\" alt=\"Kristin Wall Gibson\" style=\"width:56px;height:56px;border-radius:50%;object-fit:cover;flex-shrink:0;border:1px solid #ececf2\">\n          <div>\n            <div style=\"color:#1d243c;font-weight:700;font-size:16px;margin:0 0 2px\">Kristin Wall Gibson<\u002Fdiv>\n            <div style=\"font-size:13px;color:#3f4c7c;margin:0 0 4px\">IBM Professional Certification Program Manager<\u002Fdiv>\n            <div style=\"font-size:12.5px;color:#8890ab\">April 5, 2026 &nbsp;·&nbsp; Worked with Martin but on different teams<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <p data-rec-text=\"1\" style=\"font-size:15px;color:#3f4c7c;margin:0;text-wrap:pretty\">I have had the honor of working with Martin on several Maximo certification exams over the past decade. I truly enjoy collaboratin data-rec-text=\"1\" style=\"font-size:15px;color:#3f4c7c;margin:0;text-wrap:pretty\">Martin is widely recognized as one of the leading experts in the IBM Maximo ecosystem and a trusted authority within the global EAM community. Through my work and engagement in the Maximo domain, I have seen few professionals who combine deep technical knowledge, strong functional understanding, and architectural clarity as consistently as Martin does. He is especially well known for his contribution to community enablement and professional development through initiatives such as the Maximo Mentor Series. Martin has a unique ability to clearly articulate new Maximo Application Suite (MAS) capabilities, best practices, and real‑world techno‑functional scenarios that are directly applicable to enterprise implementations. His content reflects hands‑on experience and addresses the practical challenges faced across large‑scale implementations and ongoing operational environments. As someone actively involved in Maximo solutioning, delivery, and community engagement myself, I regard Martin as a peer‑level expert whose insights add value across the entire Maximo lifecycle—from architecture and design through implementation, optimization, and continuous improvement. I would strongly recommend Martin for any Maximo implementation, transformation initiative, or long‑term operational team. His depth of expertise, structured thinking, and commitment to advancing the Maximo community make him a highly dependable and impactful contributor for clients, partners, and delivery organizations alike.<\u002Fp>\n        <button type=\"button\" data-rec-toggle=\"1\" style=\"display:none;margin-top:12px;background:none;border:0;padding:0;font-family:inherit;font-size:14px;font-weight:700;color:#5b37ff;cursor:pointer\">Read more<\u002Fbutton>\n      <\u002Fdiv>\n\n      <div data-reveal=\"1\" style=\"position:relative;overflow:hidden;background:#fff;border:1px solid #dcd8ea;border-radius:10px;padding:clamp(20px,4vw,28px) clamp(18px,4vw,32px);box-shadow:0 4px 14px rgba(29,36,60,0.09)\">\n        <div aria-hidden=\"true\" style=\"position:absolute;top:-14px;right:146px;font-size:120px;line-height:1;font-weight:800;color:#ddd6fb;pointer-events:none;user-select:none\">”<\u002Fdiv>\n        <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:14px;margin-bottom:18px\">\n          <img src=\"9b7ee547-4eed-449c-bc5c-d55785ff3b9a\" alt=\"Jess Williams\" style=\"width:56px;height:56px;border-radius:50%;object-fit:cover;flex-shrink:0;border:1px solid #ececf2\">\n          <div>\n            <div style=\"color:#1d243c;font-weight:700;font-size:16px;margin:0 0 2px\">Jess Williams, PMP, A-CSPO, PSM, IBM Champion<\u002Fdiv>\n            <div style=\"font-size:13px;color:#3f4c7c;margin:0 0 4px\">Product Owner at EDI, an Arora Company<\u002Fdiv>\n            <div style=\"font-size:12.5px;color:#8890ab\">April 3, 2026 &nbsp;·&nbsp; Worked with Martin, different companies<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <img src=\"3b6a1293-dbb7-4b26-817c-ad53408614b5\" alt=\"IBM Champion\" title=\"IBM Champion\" style=\"position:absolute;top:18px;right:20px;width:112px;height:80px;object-fit:contain;border-radius:6px;z-index:2\">\n        <p data-rec-text=\"1\" style=\"font-size:15px;color:#3f4c7c;margin:0;text-wrap:pretty\">Martin is an incredibly knowledgeable resource. I met him years ago when he was the trainer for my Maximo certification class. He breaks down complex concepts and meets you where you are to take you on your learning journey. He is a thought leader that is also approachable and collaborative. I again had the pleasure of working with him more recently to create multiple certification exams. He is especially talented at seeing different viewpoints and merging technical needs, functional requirements, and end user experience into high value delivery. The quality with which he delivers his work is bar none. If you get the chance, I highly recom he way he works with people. What stood out to me immediately is how naturally Martin combines deep functional knowledge with a genuine passion for teaching. In his classes, he has a clear and engaging way of explaining complex Maximo concepts, making them easy to understand and apply. You can tell he truly cares about helping others learn, not just delivering content. Working together on certification materials was equally impressive. Martin brings a high level of attention to detail and a strong understanding of what truly matters in real-world scenarios. He consistently ensures that everything is practical, relevant, and aligned with real user needs. Beyond his expertise, Martin is approachable, supportive, with a wonderful sense of humor, and a pleasure to collaborate with. He creates a positive environment where ideas flow easily and everyone feels comfortable contributing. I would wholeheartedly recommend Martin to anyone looking for not just a Maximo expert, but a trusted partner and just a great person to work with.<\u002Fp>\n        <button type=\"button\" data-rec-toggle=\"1\" style=\"display:none;margin-top:12px;background:none;border:0;padding:0;font-family:inherit;font-size:14px;font-weight:700;color:#5b37ff;cursor:pointer\">Read more<\u002Fbutton>\n      <\u002Fdiv>\n\n      <div data-reveal=\"1\" style=\"position:relative;overflow:hidden;background:#fff;border:1px solid #dcd8ea;border-radius:10px;padding:clamp(20px,4vw,28px) clamp(18px,4vw,32px);box-shadow:0 4px 14px rgba(29,36,60,0.09)\">\n        <div aria-hidden=\"true\" style=\"position:absolute;top:-14px;right:146px;font-size:120px;line-height:1;font-weight:800;color:#ddd6fb;pointer-events:none;user-select:none\">”<\u002Fdiv>\n        <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:14px;margin-bottom:18px\">\n          <img src=\"30135492-1ca2-433a-b068-4972baa6277c\" alt=\"Jan-Willem Steur\" style=\"width:56px;height:56px;border-radius:50%;object-fit:cover;flex-shrink:0;border:1p oins. I always value having Martin involved, because he consistently raises both the quality of the work and the energy of the team. I highly recommend Martin.<\u002Fp>\n        <button type=\"button\" data-rec-toggle=\"1\" style=\"display:none;margin-top:12px;background:none;border:0;padding:0;font-family:inherit;font-size:14px;font-weight:700;color:#5b37ff;cursor:pointer\">Read more<\u002Fbutton>\n      <\u002Fdiv>\n\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <footer style=\"background:#f5f5f8;padding:56px 0 28px\">\n    <div style=\"max-width:1160px;margin:0 auto;padding:0 24px\">\n      <div style=\"display:flex;align-items:center;gap:10px;font-size:18px;font-weight:700;color:#1d243c;margin-bottom:14px\">\n        <img src=\"94d16660-d568-4538-86b1-1a641e25dcc0\" alt=\"4Max Ltd\" style=\"width:28px;height:28px;object-fit:contain\"> 4Max Ltd\n      <\u002Fdiv>\n      <p style=\"margin:0 0 20px;font-size:15px\">Maximo Enablement Specialist and Consulting Services<\u002Fp>\n      <div style=\"display:flex;gap:14px;margin-bottom:36px\">\n        <a href=\"https://www.youtube.com/@maximodemos2398\" target=\"_blank\" rel=\"noopener\" aria-label=\"YouTube\" style=\"width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#e9e9f0;color:#1d243c\"><svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"currentColor\"><path d=\"M22 12s0-3.2-.4-4.7a3 3 0 0 0-2.1-2.1C17.9 5 12 5 12 5s-5.9 0-7.5.2a3 3 0 0 0-2.1 2.1C2 8.8 2 12 2 12s0 3.2.4 4.7a3 3 0 0 0 2.1 2.1C6.1 19 12 19 12 19s5.9 0 7.5-.2a3 3 0 0 0 2.1-2.1c.4-1.5.4-4.7.4-4.7zM10 15V9l5 3-5 3z\"><\u002Fpath><\u002Fsvg><\u002Fa>\n        <a href=\"https://www.linkedin.com/in/martin-williams-maximo\" target=\"_blank\" rel=\"noopener\" aria-label=\"LinkedIn\" style=\"width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#e9e9f0;color:#1d243c\"><svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"cur
